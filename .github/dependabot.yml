version: 2
updates:
  - package-ecosystem: npm
    directory: "/ui.frontend"
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "@aemforms/af-core"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
