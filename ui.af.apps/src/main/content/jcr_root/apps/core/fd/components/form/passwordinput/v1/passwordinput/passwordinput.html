<sly data-sly-use.text="com.adobe.cq.forms.core.components.models.form.TextInput"
     data-sly-use.renderer="${'passwordinput.js'}"
     data-sly-use.clientlib="${'/libs/granite/sightly/templates/clientlib.html'}"
     data-sly-use.label="${renderer.labelPath}"
     data-sly-use.shortDescription="${renderer.shortDescriptionPath}"
     data-sly-use.longDescription="${renderer.longDescriptionPath}"
     data-sly-use.errorMessage="${renderer.errorMessagePath}"
     data-sly-use.questionMark="${renderer.questionMarkPath}"></sly>
<div data-sly-use.formstructparser="com.adobe.cq.forms.core.components.models.form.FormStructureParser"
     class="cmp-adaptiveform-passwordinput"
     data-cmp-is="adaptiveFormPasswordInput"
     data-cmp-visible="${text.visible ? 'true' : 'false'}"
     data-cmp-enabled="${text.enabled ? 'true' : 'false'}"
     data-cmp-required="${text.required ? 'true': 'false'}"
     data-cmp-readonly="${text.readOnly ? 'true' : 'false'}"
     id="${text.id}"
     data-cmp-adaptiveformcontainer-path="${formstructparser.formContainerPath}"
     data-sly-test.widgetId="${'{0}-{1}' @ format=[text.id, 'widget']}">
    <div class="cmp-adaptiveform-passwordinput__label-container">
      <div data-sly-call="${label.label @componentId=widgetId, labelValue=text.label.value, labelVisible=text.label.visible, labelRichText=text.label.richText, bemBlock='cmp-adaptiveform-passwordinput'}" data-sly-unwrap></div>
      <div data-sly-call="${questionMark.questionMark @componentId=text.id, longDescription=text.description, bemBlock='cmp-adaptiveform-passwordinput'}" data-sly-unwrap></div>
    </div>
    <div class="cmp-adaptiveform-passwordinput__widget-wrapper">
        <input title="${text.tooltipVisible ? '' : text.tooltipText}"
               class="cmp-adaptiveform-passwordinput__widget"
               id="${widgetId}"
               type="password"
               name="${text.name}"
               data-cmp-data-layer="${text.data.json}"
               disabled="${!text.enabled}"
               readonly="${text.readOnly}"
               required="${text.required}"
               placeholder="${text.placeHolder}"
               autocomplete="${text.autoComplete}"
               minlength="${text.minLength}"
               maxlength="${text.maxLength}"
               dir="auto"/>
        <button data-sly-test="${text.showHidePasswordEnabled}"
                type="button"
                class="cmp-adaptiveform-passwordinput__toggle-visibility"
                data-cmp-hook-adaptiveformpasswordinput="toggleVisibility"
                aria-controls="${widgetId}"
                aria-pressed="false"
                aria-label="${'Show password' @ i18n, locale=request.locale}"
                title="${'Show password' @ i18n, locale=request.locale}"></button>
    </div>
    <div data-sly-call="${shortDescription.shortDescription @componentId=text.id, shortDescriptionVisible=text.tooltipVisible, shortDescription=text.tooltip, bemBlock='cmp-adaptiveform-passwordinput'}" data-sly-unwrap>
    </div>
    <div data-sly-call="${longDescription.longDescription @componentId=text.id, longDescription=text.description, bemBlock='cmp-adaptiveform-passwordinput'}" data-sly-unwrap></div>
    <div data-sly-call="${errorMessage.errorMessage @componentId=text.id, bemBlock='cmp-adaptiveform-passwordinput'}" data-sly-unwrap></div>
</div>
